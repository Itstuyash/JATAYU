<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Default Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Credit Default Predictor</h1>
            <p class="subtitle">
                Enter the applicant's information to predict credit default risk.
            </p>

            <form id="predictionForm">

                <label for="income">Income</label>
                <input
                    type="number"
                    id="income"
                    placeholder="Enter income"
                    required
                >

                <label for="age">Age</label>
                <input
                    type="number"
                    id="age"
                    placeholder="Enter age"
                    required
                >

                <label for="loan">Loan</label>
                <input
                    type="number"
                    id="loan"
                    placeholder="Enter loan amount"
                    required
                >

                <label for="loanToIncome">Loan to Income</label>
                <input
                    type="number"
                    step="any"
                    id="loanToIncome"
                    placeholder="Enter loan to income ratio"
                    required
                >

                <button type="submit">
                    Predict Default
                </button>

            </form>

            <div id="loading" class="hidden">
                Making prediction...
            </div>

            <div id="result" class="hidden">
                <h2>Prediction Result</h2>

                <p id="predictionText"></p>
                <p id="confidenceText"></p>
            </div>

            <div id="error" class="hidden"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
